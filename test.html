<!DOCTYPE html>
<html>
<head><title>OpenMed Browser Test</title></head>
<body>
<pre id="output">Loading model...</pre>
<script type="module">
import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3";

const output = document.getElementById("output");

const classifier = await pipeline(
  "token-classification",
  "OpenMed/OpenMed-PII-SuperClinical-Small-44M-v1-onnx-android",
  { dtype: "q8" }
);

output.textContent = "Model loaded. Running inference...";

const text = `Patient: Beaumont, Diane Rose
MRN: CRC-0338715 DOB / Age / Sex: 1975-06-22 / 49 / Female
Consultant: Hannah Whitmore, MD, FRCSC (Gynecologic Oncology)
Referred by: Ellen Cho, MD, CCFP (Family Medicine)`;

const result = await classifier(text, { aggregation_strategy: "simple" });
output.textContent = JSON.stringify(result, null, 2);
</script>
</body>
</html>
